# Builds BCU KR for PC (build/dist/BCU-KR-<version>.zip: BCU-KR.jar, its libraries and a read-me) and publishes it
# as a GitHub Release, so it can be downloaded from the repository page (Releases > latest).
# Runs when started by hand (Actions > "Release" > Run workflow) or when a tag like v0.5.8.8-kr2 is pushed.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty: v + the version in build.gradle.kts, e.g. v0.5.8.8-kr1)"
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        # Retried once: the JOGL server (jogamp.org) is sometimes unreachable from GitHub.
        run: ./gradlew bcuKrZip --no-configuration-cache --console=plain || { sleep 60; ./gradlew bcuKrZip --no-configuration-cache --console=plain; }
      - name: Check the zip
        run: |
          zip=$(ls build/dist/BCU-KR-*.zip)
          unzip -l "$zip" | grep -q "BCU-KR/BCU-KR.jar" || { echo "::error::BCU-KR.jar is missing"; exit 1; }
          unzip -p "$zip" BCU-KR/BCU-KR.jar > /tmp/bcu.jar
          for c in kr jp en tw; do
            unzip -l /tmp/bcu.jar | grep -q "country/$c/files.json" \
              || { echo "::error::The country data list country/$c/files.json is missing from the jar."; exit 1; }
          done
          unzip -p /tmp/bcu.jar META-INF/MANIFEST.MF | grep -q "Class-Path: lib/" || { echo "::error::No Class-Path"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          ver=$(sed -n 's/^val bcuKrVersion = "\([^"]*\)".*/\1/p' build.gradle.kts)
          tag="${TAG_INPUT:-${GITHUB_REF_NAME}}"
          case "$tag" in v*) ;; *) tag="v$ver" ;; esac
          zip="build/dist/BCU-KR-$ver.zip"
          notes="BCU KR $ver: Battle Cats Ultimate for PC with BCU core 0.7.20.0 and the game's country versions (Settings > Game version: Korea, Japan, English or Taiwan 15.6, or BCU's own data).

          Download **BCU-KR-$ver.zip** below, unzip it into its own folder, install Java 8 or newer and start **BCU-KR.jar**. See README.txt inside.

          Not made by me: Battle Cats Ultimate is by the BCU team; Battle Cats is © PONOS."
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$zip" --clobber
          else
            gh release create "$tag" "$zip" --title "BCU KR $ver (PC)" --notes "$notes" --target "$GITHUB_SHA" --latest
          fi
          echo "### Download: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
